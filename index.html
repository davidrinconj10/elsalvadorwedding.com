function post(slug){const p=POSTS.find(x=>x[0]===slug);if(!p)return PAGES[""]();

const lb=$("#lb"),lc=$("#lc");let idx=0,LB=[];

$("#lx").onclick=close;$("#lp").onclick=()=>step(-1);$("#ln").onclick=()=>step(1);lb.onclick=e=>{if(e.target===lb)close()};
